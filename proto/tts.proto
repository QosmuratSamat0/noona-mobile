syntax = "proto3";

package tts;

option go_package = "github.com/QosmuratSamat0/Noona-AI/backend/pkg/pb/tts;ttspb";

message SpeechRequest {
  string text = 1;
  string voice = 2; // e.g., en_US-lessac-medium
}

message AudioChunk {
  bytes data = 1;
  string file_url = 2; // Optional, set in the last chunk
}

service TTSService {
  rpc StreamSpeech(SpeechRequest) returns (stream AudioChunk);
}
