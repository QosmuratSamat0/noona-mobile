name: noona_mobile_flutter
description: Flutter mobile client for Noona AI.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.1.0
  http: ^1.2.2
  path_provider: ^2.1.4
  record: ^5.1.2
  shared_preferences: ^2.2.3
  web_socket_channel: ^3.0.1

dependency_overrides:
  # record_linux 0.7.2 is not compatible with current record_platform_interface.
  # Android builds still compile the registered desktop implementation, so use
  # a local Linux stub until upstream record_linux updates.
  record_linux:
    path: third_party/record_linux_stub
  record_platform_interface: 1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
